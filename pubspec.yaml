name: kemlock_core
description: "The pure-Dart core of Kemlock, a post-quantum encrypted authenticator and password manager: its crypto, vault, sync engines, OTP and site matching, shared by the app and the browser extension."
version: 0.1.0
publish_to: none
repository: https://github.com/Arsslensoft/Kemlock-core
issue_tracker: https://github.com/Arsslensoft/Kemlock-core/issues

environment:
  sdk: ^3.13.5

dependencies:
  archive: ^4.5.2
  collection: ^1.19.1
  crypto: ^3.0.7
  cryptography: ^2.9.0
  http: ^1.6.0
  pointycastle: ^4.0.0
  unorm_dart: ^0.3.3
  xml: ^7.0.1

dev_dependencies:
  lints: ^6.0.0
  path: ^1.9.1
  test: ^1.31.1
