name: Title

# The pull request's title is a Conventional Commit, since it becomes the commit's subject when the
# pull request is squashed, and the Release workflow reads the type to decide the next version. Its
# own workflow, so that editing a title runs this alone and not the other checks again. The main
# ruleset requires the job by name: keep it.

on:
  pull_request:
    types: [opened, edited, synchronize, reopened]

permissions: {}

concurrency:
  group: title-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  title:
    name: Title
    runs-on: ubuntu-24.04
    permissions:
      pull-requests: read
    steps:
      - uses: amannn/action-semantic-pull-request@2252a14e810aa9b85c2d560bd7070c802206ecf6 # v6.1.2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
