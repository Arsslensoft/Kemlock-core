name: CodeQL

# GitHub's code scanning of the workflows themselves, on every pull request and push to main, and
# once a week for the queries that are new. CodeQL does not support Dart, so the package's code is
# left to the analyzer (checks.yml); the scan is of the workflows alone. The findings are in the
# repository's Security tab.

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: '17 4 * * 3'

# A newer run for the same pull request, or a newer push to main, cancels the one still going.
# The weekly run has a group of its own, so a push never cancels it.
concurrency:
  group: codeql-${{ github.event.pull_request.number || github.ref }}-${{ github.event_name }}
  cancel-in-progress: ${{ github.event_name != 'schedule' }}

permissions: {}

jobs:
  analyze:
    name: Analyze (${{ matrix.language }})
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      actions: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        language:
          - actions
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Nothing is compiled: the scan reads the source
      - uses: github/codeql-action/init@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
        with:
          languages: ${{ matrix.language }}
          build-mode: none

      - uses: github/codeql-action/analyze@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
        with:
          category: /language:${{ matrix.language }}
